<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#ffffff"/>

  <text x="600" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#172554">
    Relationships Between Three Sets
  </text>
  <text x="600" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#64748b">
    A Venn diagram shows how elements are shared between sets
  </text>

  <!-- Universal Set -->
  <rect x="90" y="140" width="1020" height="560" rx="24" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="1070" y="175" text-anchor="end" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#334155">U</text>

  <!-- Set A -->
  <circle cx="475" cy="405" r="205" fill="#60a5fa" fill-opacity="0.42" stroke="#2563eb" stroke-width="4"/>
  <!-- Set B -->
  <circle cx="725" cy="405" r="205" fill="#f472b6" fill-opacity="0.40" stroke="#db2777" stroke-width="4"/>
  <!-- Set C -->
  <circle cx="600" cy="520" r="205" fill="#34d399" fill-opacity="0.38" stroke="#059669" stroke-width="4"/>

  <!-- Labels -->
  <text x="365" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#1d4ed8">A</text>
  <text x="835" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#be185d">B</text>
  <text x="600" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#047857">C</text>

  <!-- Elements in A only -->
  <text x="390" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#172554">1</text>
  <text x="360" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#172554">2</text>

  <!-- Elements in B only -->
  <text x="810" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#172554">7</text>
  <text x="840" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#172554">8</text>

  <!-- A intersection B -->
  <text x="600" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#7c2d12">3</text>

  <!-- A intersection C -->
  <text x="500" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#065f46">4</text>

  <!-- B intersection C -->
  <text x="700" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#831843">5</text>

  <!-- All three -->
  <circle cx="600" cy="455" r="32" fill="#facc15" fill-opacity="0.85" stroke="#ca8a04" stroke-width="3"/>
  <text x="600" y="464" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#713f12">6</text>

  <!-- Outside all sets -->
  <text x="180" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#475569">9</text>
  <text x="1020" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#475569">10</text>

  <!-- Bottom explanation -->
  <rect x="255" y="725" width="690" height="48" rx="24" fill="#eef2ff"/>
  <text x="600" y="757" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#3730a3">
    The centre region contains elements common to A, B and C.
  </text>
</svg>